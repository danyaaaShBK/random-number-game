<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/JavaScript__logo.png">
  <title>random number</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="heading__text">
      <h1>Игра "угадай число"</h1>
      <p>Бот придумал число, которое будет в диапозоне от 1 до 100. Он бросает тебе вызов, сможешь ли ты угадать это число. У тебя есть 7 попыток, удачи!</p>
    </div>
    <div class="game__container">
      <label for="guessField">Введи число: </label>
      <input type="text" id="guessField" class="guessField">
      <button type="submit" class="guessSubmit">Отправить</button>
      <div class="resultParas">
        <p class="enter__guess"></p>
        <p class="last__result"></p>
        <p class="low__or__high"></p>
      </div>
    </div>
  </div>
</body>
</html>
